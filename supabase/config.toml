# Supabase CLI (2.x) · 369 Capital Humano. Dueño: plataforma.
# Local: `supabase start` (requiere Docker). En CI: job `pgtap` de .github/workflows/deploy.yml.
# Producción: `supabase link --project-ref $SUPABASE_PROJECT_REF` + `db push` + `functions deploy`.
# Crons: NO se configuran aquí; se programan con pg_cron + pg_net en
# supabase/migrations/00000000000001_plataforma.sql (ver docs/runbook.md §Crons).
project_id = "capital-humano-369"

[api]
enabled = true
port = 54321
# Schemas expuestos por PostgREST para el panel (supabase-js con { db: { schema } }).
# Seguros de exponer: RLS deny-by-default y sin grants a anon (prueba S2).
# `privacidad` NO se expone (solo service_role).
schemas = ["public", "graphql_public", "shared", "config", "citas", "captacion", "comunicacion", "tracking", "dashboard"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
# Sin seed: los datos de prueba viven en test/db/fixtures.ts.
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/panel/", "http://127.0.0.1:3000/panel/acceso/", "https://369capitalhumano.com/panel/", "https://369capitalhumano.com/panel/acceso/"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Panel solo por invitación (admin/reclutador/cliente se asignan en shared.usuarios_roles).
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 900

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

[analytics]
enabled = false

# ---------------------------------------------------------------------
# Edge functions. Todas comparten el import map de supabase/functions/deno.json
# (zod → npm:zod@4, @shared/ y @domains/ → ../../src/...).
#  - Públicas (navegador, webhooks): verify_jwt = false. Protegidas por CORS, Turnstile,
#    rate limit (shared.rate_limit_consumir), firma HMAC (webhooks) y validación Zod.
#  - Workers/crons: verify_jwt = true. Solo los invoca pg_cron con la service key (Vault).
# ---------------------------------------------------------------------
[functions.citas-api]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.postular]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.verificar-otp]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.gestionar-cita]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.contacto-b2b]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.tracking-ingest]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.webhook-evolution]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.webhook-nbx]
verify_jwt = false
import_map = "./functions/deno.json"

# Workers (pg_cron con la service key). retencion-diaria (privacidad) se agrega cuando exista su carpeta;
# su cron ya está programado en 00000000000001_plataforma.sql.
[functions.comunicacion-worker]
verify_jwt = true
import_map = "./functions/deno.json"

[functions.zoho-sync-worker]
verify_jwt = true
import_map = "./functions/deno.json"

[functions.zoho-reconciliacion]
verify_jwt = true
import_map = "./functions/deno.json"

[functions.tracking-capi-worker]
verify_jwt = true
import_map = "./functions/deno.json"

# NFR-OBS-01: alertas automáticas (cron */5 en 20261113080002_observabilidad_alertas.sql).
[functions.alertas]
verify_jwt = true
import_map = "./functions/deno.json"

# Panel (dueño: vacantes/panel). La llama el navegador con la sesión de Supabase Auth del usuario:
# el gateway exige un JWT válido y el handler además lo verifica contra /auth/v1/user.
[functions.panel-reglas]
verify_jwt = true
import_map = "./functions/deno.json"

# Privacidad (dueño: privacidad). retencion-diaria la llama pg_cron con la service key;
# arco la usa un admin (JWT verificado + MFA aal2) o el servicio.
[functions.retencion-diaria]
verify_jwt = true
import_map = "./functions/deno.json"

[functions.arco]
verify_jwt = true
import_map = "./functions/deno.json"
