# Sitio estático (D5, NFR-ESC-02): sirve apps/web/out tal como lo sube el deploy (rsync --delete).
# Instalar en /etc/nginx/sites-available/369capitalhumano.conf y enlazar a sites-enabled.
# AJUSTAR: server_name, rutas de certificados y `root` (= DEPLOY_PATH del workflow).
# Verificado por infra/nginx/nginx.test.ts. Probar en el servidor con `sudo nginx -t`.

server {
    listen 80;
    listen [::]:80;
    server_name 369capitalhumano.com www.369capitalhumano.com;
    server_tokens off;

    # ACME (certbot --webroot) antes de redirigir.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/369capitalhumano/out;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 369capitalhumano.com www.369capitalhumano.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/369capitalhumano.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/369capitalhumano.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/369capitalhumano/out;
    index index.html;
    charset utf-8;
    absolute_redirect off;
    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/x-component;

    # Headers de seguridad + HTML siempre revalidado (cada deploy se ve de inmediato).
    include snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;

    # trailingSlash (next.config.ts): /vacantes/agente-smart → /vacantes/agente-smart/ conservando la query (UTM).
    location ~ ^([^.]*[^/])$ {
        return 301 $1/$is_args$args;
    }

    location / {
        limit_except GET HEAD {
            deny all;
        }
        try_files $uri $uri/ =404;
    }

    # Assets con hash de contenido: inmutables por 1 año.
    location ^~ /_next/static/ {
        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Medios e imágenes sin hash: 7 días.
    location ~* \.(?:webp|avif|png|jpe?g|gif|svg|ico|mp4|webm|woff2?)$ {
        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Archivos ocultos (.git, .env…) nunca se sirven; .well-known sí.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
}
