# PLANTILLA de la Content-Security-Policy (NFR-SEG-07). NO se instala tal cual: scripts/csp-hashes.mjs
# (postbuild y CI) sustituye el marcador de script-src por los 'sha256-…' de cada <script> inline de
# apps/web/out/**/*.html y escribe infra/nginx/csp.conf, que se instala en /etc/nginx/snippets/csp.conf
# (lo incluye security-headers.conf) y que usa scripts/serve-out.mjs en los E2E.
#
# script-src SIN 'unsafe-inline': el export de Next.js genera scripts inline de hidratación (RSC payload,
# bootstrap de Turbopack) que cambian en cada build; se permiten por hash. Los terceros (GTM/GA4, Pixel,
# Clarity, Turnstile, Stape) se cargan como <script src> por host y SOLO tras consentimiento (TRK-01).
# OJO: si en GTM se agregan etiquetas "HTML personalizado" con scripts inline, la CSP las bloqueará
# (deseable); deben implementarse como plantillas o vía Stape server-side.
# style-src conserva 'unsafe-inline' (atributos style de React; no ejecuta código).
# Si Stape usa un subdominio propio (p. ej. sst.369capitalhumano.com), agrégalo en script-src, connect-src e img-src.

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' __CSP_SCRIPT_HASHES__ https://www.googletagmanager.com https://*.googletagmanager.com https://connect.facebook.net https://www.clarity.ms https://*.clarity.ms https://challenges.cloudflare.com https://*.stape.io; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://www.facebook.com https://*.google-analytics.com https://*.googletagmanager.com https://*.clarity.ms https://c.bing.com https://*.stape.io; media-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://www.facebook.com https://connect.facebook.net https://*.clarity.ms https://challenges.cloudflare.com https://*.stape.io; frame-src https://challenges.cloudflare.com https://www.googletagmanager.com https://www.google.com https://www.facebook.com; worker-src 'self' blob:; manifest-src 'self'" always;
