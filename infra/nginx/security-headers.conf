# Headers de seguridad (NFR-SEG-07). Instalar en /etc/nginx/snippets/security-headers.conf
# e incluir en el server HTTPS y en CADA location que declare su propio add_header
# (Nginx no hereda add_header si el bloque hijo define alguno). Verificado por
# infra/nginx/nginx.test.ts y e2e/headers.spec.ts (E2E-14).
#
# CSP: vive en snippets/csp.conf, GENERADA en cada build por scripts/csp-hashes.mjs desde
# infra/nginx/csp.plantilla.conf con los hashes sha256 de los scripts inline del export: script-src
# SIN 'unsafe-inline'. El deploy la sube junto con out/ (ver docs/runbook.md, "CSP por build").
include snippets/csp.conf;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), fullscreen=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
